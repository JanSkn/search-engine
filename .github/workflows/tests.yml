name: Tests
on:
  pull_request:
    branches: [ main ]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        run: |
          sudo apt-get update -y
          sudo apt-get install -y just
        shell: bash
      - name: Run tests
        run: just test